name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches VERSION_NAME
        run: |
          v=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION_NAME=$v"; exit 1; }
      - name: Test, lint and build
        run: ./gradlew --no-daemon test lintRelease assembleRelease
      - name: Package
        run: |
          v=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/release/app-release.apk "WiiLauncherTv-$v.apk"
          sha256sum "WiiLauncherTv-$v.apk" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            WiiLauncherTv-*.apk
            SHA256SUMS.txt
          generate_release_notes: true
